# ============================================================================
# Deterministic LOCAL: tp24 — per-station 99th pct from local obs climatology
# ============================================================================
# ifs_oper_0.1degree (tco1279, model1) vs iekm_0.1degree (tco2559, model2)
# Period: 2024-07-21 to 2025-07-15  (Jul 2024 – Jul 2025)
# Seasons: DJF, MAM, JJA, SON  x  orography: flat, hilly, complex
# Threshold: per-station p99 from local obs climatology (wet extremes)
# ============================================================================

variable: "tp24"
start_date: "2024-07-21"
end_date: "2025-07-15"
mode: "deterministic"
forecast_days: [1, 2, 3, 4, 5]
lead_time_frequency: 24
skip_extraction_if_exists: false
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs_oper_0.1degree"
    source: "local_grib"
    unit_conversion_factor: 1000.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast/raw/ifs_oper_0.1degree"

  forecast_model2:
    name: "iekm_0.1degree"
    source: "local_grib"
    unit_conversion_factor: 1000.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast/raw/iekm_0.1degree"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/precip/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: 24

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/tp24_local_p99obsclim_iekm_vs_ifsoper"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "MAM", "JJA", "SON"]
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: true
  outlier_threshold_std: 5.0
  max_valid_precipitation: 800.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "tp"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/tp24_local_p99obsclim_iekm_vs_ifsoper"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  create_heatmap: true
  dpi: 300
  format: "png"
