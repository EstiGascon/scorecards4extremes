# ============================================================================
# EXAMPLE — Deterministic, backend = quaver_extract
# ============================================================================
# Demonstrates STEP-1-ONLY quaver/VTB point extraction.
#
# What `backend: quaver_extract` does:
#   * Retrieves forecasts fresh from MARS  (vtb.media.mars_retrieve)
#   * Retrieves observations fresh from STVL (vtb.media.stvl_retrieve)
#   * Interpolates forecasts to station locations with Fieldset.aligned()
#     (interpolation_method below — bilinear by default)
#   * Writes the SAME per-forecast-day parquet files as the local extractor.
#
# Everything downstream (threshold / filter / scores / bootstrap / plot) uses
# the existing local pipeline unchanged.
#
# Run on Atos with the quaver module loaded, e.g.:
#     module load quaver/3.6.4
#     python run.py configs/deterministic/config_2t_quaverextract_iekm_vs_ifs_EXAMPLE.yaml
# ============================================================================

variable: "2t"
start_date: "2025-08-01"
end_date: "2025-08-31"
mode: "deterministic"
backend: "quaver_extract"          # <-- selects the new VTB extraction path
forecast_days: [1, 2, 3, 4, 5]
lead_time_frequency: 6
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA  (MARS identity keys used by the quaver/VTB retrieval)
# ============================================================================
read_data:
  forecast_model1:
    name: "iekm"
    source: "quaver"
    unit_conversion_factor: 1.0     # 2t is in K; leave 1.0 (K->C handled internally)
    quaver:
      class: "rd"
      expver: "iekm"
      stream: "oper"
      type: "fc"
      # grid: "O1280"               # optional target grid; omit for native
      # interpolation: "grid-box-average"  # optional MARS-side interpolation

  forecast_model2:
    name: "ifs_single"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "od"
      expver: "1"
      stream: "oper"
      type: "fc"

  # Observation source for STVL retrieval
  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true       # applied later in filter.py using model heights
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_quaverextract_iekm_vs_ifs"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"   # nearest (default, VTB native) | bilinear | idw

# ============================================================================
# AUXILIARY FIELDS (sdfor / lsm / orography)
# RETRIEVED from MARS first; these local paths are READ only as a fallback
# when MARS retrieval is not possible. Orography is retrieved per model (using
# each model's read_data.<model>.quaver keys) so heights match the model grid.
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  outlier_threshold_std: 5.0
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — local obs climatology, 99th percentile (warm extremes)
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "2t"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 1000
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_quaverextract_iekm_vs_ifs"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  create_heatmap: true
  dpi: 300
  format: "png"
