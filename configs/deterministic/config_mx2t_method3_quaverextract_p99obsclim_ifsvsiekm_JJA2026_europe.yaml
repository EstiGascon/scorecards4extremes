# ============================================================================
# DETERMINISTIC — METHOD 3 (quaver_extract) — mx2t warm extremes (p99), JJA 2026
# EUROPE — IFS vs DestinE (rd/iekm)
# ============================================================================
# Same variable/period/threshold/orography split as
# config_mx2t_method3_quaverextract_p99obsclim_ifsvsaifs_JJA2026_europe.yaml,
# but IFS deterministic operational vs the DestinE research experiment iekm
# instead of AIFS. iekm only has forecasts out to day 5, so forecast_days is
# truncated to [1..5] (still lead_time_frequency: 6 for the mx2t daily-max
# aggregation — iekm archives sub-daily steps at least every 3h, so 6-hourly
# is a clean subset).
#
#   Reference model : IFS deterministic operational (ifs_oper, od/oper/0001)
#   Evaluated model  : DestinE research deterministic (iekm,    rd/oper/iekm)
# ============================================================================

variable: "mx2t"
start_date: "2026-06-01"
end_date: "2026-08-31"
mode: "deterministic"
backend: "quaver_extract"
forecast_days: [1, 2, 3, 4, 5]
lead_time_frequency: 6
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA — MARS identity keys used by the quaver/VTB retrieval
# ============================================================================
read_data:
  forecast_model1:                       # IFS deterministic operational (reference)
    name: "ifs_oper"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "od"
      expver: "0001"
      stream: "oper"
      type: "fc"

  forecast_model2:                       # DestinE research deterministic (evaluated)
    name: "iekm"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "rd"
      expver: "iekm"
      stream: "oper"
      type: "fc"

  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/mx2t_method3_quaverextract_p99obsclim_ifsvsiekm_JJA2026_europe"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:                                # ifs_oper
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:                                # iekm
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — JJA only, 3 orography columns
# ============================================================================
filter:
  lead_times: null
  season: "JJA"
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "mx2t"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twMAE_hit_mae"
    - "twMAE_miss_severity"
    - "twMAE_fa_severity"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/mx2t_method3_quaverextract_p99obsclim_ifsvsiekm_JJA2026_europe"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
