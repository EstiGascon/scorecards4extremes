# ============================================================================
# Local pipeline: 2t — pooled obs dataset 99th percentile (warm extremes)
# ============================================================================
# ifs_oper (model1) vs aifs1.0_oper (model2)
# Period: 2024-07-01 to 2025-06-30
# Forecast days: 1, 3, 5, 7, 10
# Threshold: p99 from pooled obs dataset (dataset_climatology)
# lapse-rate correction applied (2t in Celsius)
# ============================================================================

variable: "2t"
start_date: "2024-07-01"
end_date: "2025-06-30"
mode: "deterministic"
forecast_days: [1, 3, 5, 7, 10]
lead_time_frequency: 6
skip_extraction_if_exists: true
skip_scoring_if_exists: true

# ============================================================================
# STEP 1: READ DATA (local GRIB)
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs_oper"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast/raw/ifs_oper"

  forecast_model2:
    name: "aifs1.0_oper"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast/raw/aifs1.0_oper"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/2mtemp/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_local_p99obsclim_ifs_oper_aifs1.0_oper"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "MAM", "JJA", "SON"]
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  outlier_threshold_std: 5.0
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "dataset_climatology"
  event_type: "above"
  dataset_climatology:
    percentile: 99
    use_filtered_data: true

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 1000
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_local_p99obspool_ifs_oper_aifs1.0_oper"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
