# ============================================================================
# Local pipeline: 2t — per-station 1st pct from local obs climatology
# ============================================================================
# ifs4destine50r1 (model1) vs destine50r1 (model2)
# Period: 2024-07-01 to 2026-02-28
# Forecast days: 1–5, no season split (full period together)
# Threshold: per-station p1 from local obs climatology files (cold extremes)
# lapse-rate correction applied (2t in Celsius)
# ============================================================================

variable: "tp24"
start_date: "2025-03-01"
end_date: "2026-02-28"
mode: "deterministic"
forecast_days: [1, 3, 5]
lead_time_frequency: 24
skip_extraction_if_exists: false
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA (local GRIB)
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs_oper_0.1degree"
    source: "local_grib"
    unit_conversion_factor: 1000.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast/raw/ifs_oper_0.1degree"

  forecast_model2:
    name: "iekm_0.1degree"
    source: "local_grib"
    unit_conversion_factor: 1000.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast/raw/iekm_0.1degree"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/precip/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  lapse_rate: -0.0065
  precipitation_accumulation_hours: 24

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/tp24_local_p99obsclim_iekm_ifs_single"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "MAM", "JJA", "SON"]
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: true
  #outlier_threshold_std: 5.0
  min_valid_precipitation: 0.0
  max_valid_precipitation: 800.0

# ============================================================================
# STEP 5: THRESHOLD — fixed 30 mm/24h
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 30.0

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/tp24_local_p99obsclim_iekm_ifs_single"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  create_heatmap: true
  dpi: 300
  format: "png"
