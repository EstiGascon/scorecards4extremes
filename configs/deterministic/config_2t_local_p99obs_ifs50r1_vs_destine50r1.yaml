# ============================================================================
# Deterministic LOCAL: 2t — dataset climatology 1st percentile (cold)
# ============================================================================
# Local replica of config_2t_quaver_hdobs_fixedm10.yaml for comparison.
# Uses local grib files instead of Quaver.
# ifs_oper (expver=1) vs iekm (expver=iekm = ifs_4p4km_49r1)
# ============================================================================

variable: "2t"
start_date: "2025-08-01"  # Full year for comparison
end_date: "2026-02-28"
mode: "deterministic"
forecast_days: [1,2, 3, 4, 5]
lead_time_frequency: 6
skip_extraction_if_exists: true
skip_scoring_if_exists: true

# ============================================================================
# STEP 1: READ DATA
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs4destine50r1"
    source: "local_grib"
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast/raw/ifs4destine50r1"

  forecast_model2:
    name: "destine50r1"
    source: "local_grib"
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast/raw/destine50r1"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/2mtemp/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_local_p99obs_ifs50r1_vs_destine50r1"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  #  lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
  #  orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  outlier_threshold_std: 5.0
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — fixed −10 °C
# ============================================================================
threshold:
  method: "dataset_climatology"
  event_type: "above"
  dataset_climatology:
    percentile: 99
    use_filtered_data: true

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_local_p99obs_ifs50r1_vs_destine50r1"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
