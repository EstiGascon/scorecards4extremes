# ============================================================================
# Local pipeline: tp24 — pooled dataset 99th percentile (heavy precipitation)
# ============================================================================
# ifs4destine50r1 (model1) vs destine50r1 (model2)
# Period: 2025-08-01 to 2026-02-28
# Forecast days: 1–5, seasons: ASO and DJF separately
# Threshold: pooled 99th percentile computed from the filtered dataset
# Precipitation accumulates from step=0 → 24h accumulation applied
# ============================================================================

variable: "tp24"
start_date: "2025-08-01"
end_date: "2026-02-28"
mode: "deterministic"
forecast_days: [1, 2, 3, 4, 5]
lead_time_frequency: 24
skip_extraction_if_exists: true
skip_scoring_if_exists: true

# ============================================================================
# STEP 1: READ DATA (local GRIB)
# ============================================================================
read_data:
  forecast_model1:
    name: "iekm"
    source: "local_grib"
    unit_conversion_factor: 1000.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast/raw/iekm"

  forecast_model2:
    name: "destine50r1"
    source: "local_grib"
    unit_conversion_factor: 1000.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast/raw/destine50r1"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/precip/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: 24

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/tp24_local_p99obspool_iekm_destine50r1"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["ASO", "DJF"]
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: true
  outlier_threshold_std: 5.0
  max_valid_precipitation: 800.0

# ============================================================================
# STEP 5: THRESHOLD — pooled 99th percentile from the filtered dataset
# ============================================================================
threshold:
  method: "dataset_climatology"
  event_type: "above"
  dataset_climatology:
    percentile: 99
    use_filtered_data: true

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 1000
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/tp24_local_p99obspool_iekm_destine50r1"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
