# ============================================================================
# Local pipeline: 2t — per-station 1st pct from locally computed obs clim
# ============================================================================
# Uses local_obs_climatology threshold: reads clim_2t_1_MM_* GEO NCOLS files
# and looks up the per-station 1st percentile for the month of each date.
# Note: 2t clim values are already in Celsius (converted in obsclim.py).
#
# Climatology: SYNOP+HDOBS 2m temperature 1-day mean, 2005–2024, 65% min avail
# COLD extremes: below 1st percentile per station per month.
# ifs_oper (tco1279) vs iekm (tco2559)
# Period: 2024-12-01 to 2025-08-31  —  Steps: 24h to 120h (days 1–5)
# ============================================================================

variable: "2t"
start_date: "2024-12-01"
end_date: "2025-08-31"
mode: "deterministic"
forecast_days: [1, 3, 5]
lead_time_frequency: 6
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA (local GRIB)
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs_oper"
    source: "local_grib"
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast/raw/ifs_oper"

  forecast_model2:
    name: "iekm"
    source: "local_grib"
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast/raw/iekm"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/2mtemp/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_local_p1obs"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "MAM"]
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  outlier_threshold_std: 5.0
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 1st pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "below"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "2t"
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65
    percentile: 1

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 100
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_local_p1obsclim"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  create_heatmap: true
  dpi: 300
  format: "png"
