# ============================================================================
# Local pipeline: tp24 — per-station 99th pct from locally computed obs clim
# ============================================================================
# Uses the local_obs_climatology threshold method: reads GEO NCOLS files in
# obs_clim_local/ (produced by obsclim.py), looks up the per-station 99th
# percentile for the month of each forecast date.
#
# Climatology: SYNOP+HDOBS tp 1-day accumulation, 2005–2024 (20 years), 65%
# minimum data availability per station.
#
# IFS oper (tco1279) vs iekm (tco2559)
# Period: 2024-12-01 to 2025-07-15  —  Steps: 24h to 120h (days 1–5)
# ============================================================================

variable: "tp24"
start_date: "2024-12-01"
end_date: "2025-07-15"
mode: "deterministic"
forecast_days: [1, 3, 5]
lead_time_frequency: 24
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA (local GRIB)
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs_oper"
    source: "local_grib"
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast/raw/ifs_oper_0.1degree"

  forecast_model2:
    name: "iekm"
    source: "local_grib"
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast/raw/iekm_0.1degree"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/precip/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: 24

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/tp24_local_p99obs"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "MAM", "JJA"]
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: true
  outlier_threshold_std: 5.0
  max_valid_precipitation: 800.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    # Directory containing clim_tp_*_*_*years_*_*_* files
    path: "./obs_clim_local"
    # Parameter name (matches obsclim.py: 'tp', '2t', '10ff', ...)
    parameter: "tp"
    # Aggregation window in days (1 = 24h accumulation for tp24)
    window_days: 1
    # Climatology period used when generating the files
    n_years: 20
    first_year: 2005
    last_year: 2024
    # Minimum data availability (%) used in obsclim.py (suffix in filename)
    min_availability_pct: 65
    # Which percentile to use as the extreme threshold
    percentile: 99

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 100
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/tp24_local_p99obsclim"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  create_heatmap: true
  dpi: 300
  format: "png"
