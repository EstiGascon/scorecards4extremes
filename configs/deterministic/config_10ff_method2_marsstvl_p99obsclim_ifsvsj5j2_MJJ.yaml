# ============================================================================
# DETERMINISTIC — METHOD 2 (MARS + STVL) — 10ff extreme wind (p99), MJJ
# ============================================================================
# Deterministic counterpart family to the tp24/2t p99 MJJ configs — compares
# operational IFS-HRES against research experiment j5j2 (rd/oper/j5j2), which
# runs on the SAME higher-resolution tco2559 grid as iekm. Same period/season/
# area conventions as the 2t/tp24 j5j2 MJJ configs, EXCEPT coastal stations
# are KEPT here (remove_coastal_stations: false — wind extremes at coastal/
# sea-exposed stations are meaningful and should not be excluded).
#
# Evaluated model  : IFS deterministic operational (ifs_oper, od/oper/0001)  forecast_model1
# Reference model  : j5j2 research deterministic   (j5j2,     rd/oper/j5j2) forecast_model2
#
# Period: 2026-05-13 to 2026-08-19, single season "MJJ" (May-Jun-Jul; trailing
# Aug dates naturally excluded by the season filter).
# forecast_days 1-5, 6-HOURLY steps (j5j2/rd archive is only confirmed out to
# step 120h = day 5, matching the tp24 j5j2 MJJ probe). Threshold method
# local_obs_climatology triggers automatic daily-mean aggregation (Step 5b)
# BEFORE scoring, so the 6-hourly samples are compared against the daily-mean
# obs climatology percentile, not the instantaneous 6-hourly value.
# Threshold: per-station p99 from local obs climatology (extreme wind, above).
# ============================================================================

variable: "10ff"
start_date: "2026-05-13"
end_date: "2026-08-19"
mode: "deterministic"
backend: "local"
forecast_days: [1, 2, 3, 4, 5]
lead_time_frequency: 6
skip_extraction_if_exists: false
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA — retrieve deterministic HRES from MARS (forecasts) + STVL (obs)
# ============================================================================
read_data:
  forecast_model1:                       # IFS deterministic operational (reference)
    name: "ifs_oper"
    source: "mars"
    unit_conversion_factor: 1.0
    mars:
      class: od
      type: fc
      stream: oper
      expver: "0001"
      levtype: sfc
      time: "00"
      base_path: "/ec/vol/destine/continuous_evaluation/10wind_speed/forecast/raw"
      # database: fdb                    # uncomment if MARS reports "not found"

  forecast_model2:                       # j5j2 research deterministic (evaluated)
    name: "j5j2"
    source: "mars"
    unit_conversion_factor: 1.0
    mars:
      class: rd
      type: fc
      stream: oper
      expver: "j5j2"
      levtype: sfc
      time: "00"
      base_path: "/ec/vol/destine/continuous_evaluation/10wind_speed/forecast/raw"
      # database: fdb                    # uncomment if the research expver needs FDB

  observation_source: "stvl"
  stvl:
    sources: ["synop", "hdobs"]
    base_path: "/ec/vol/destine/continuous_evaluation/10wind_speed/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: true
  lapse_rate_correction: false
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/10ff_method2_marsstvl_p99obsclim_ifsvsj5j2_MJJ"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS (j5j2 runs on the finer tco2559 grid — separate lsm/orog)
# ============================================================================
auxiliary_fields:
  model1:                                # IFS deterministic operational
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:                                # j5j2 (tco2559)
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — MJJ season, orography split, COASTAL STATIONS KEPT
# ============================================================================
filter:
  lead_times: null
  season: "MJJ"
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: false
  coastal_lsm_threshold: 0.9
  min_valid_wind_speed: 0.0
  max_valid_wind_speed: 100.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "10ff"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES (deterministic)
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 500
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/10ff_method2_marsstvl_p99obsclim_ifsvsj5j2_MJJ"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
