# ============================================================================
# METHOD 3 of 3 — backend = quaver_extract (VTB MARS + STVL, point extraction)
# ============================================================================
# 10ff extreme wind (10m wind speed > 10 m/s), January 2026, Europe.
# Evaluated model : rd / expver=iekm   (forecast_model1)
# Reference model : IFS deterministic operational (od / expver=0001) (forecast_model2)
# Forecast days 1, 3, 5, TRUE 3-hourly lead times · no season split · orography only.
#
# Extraction method: STEP-1-ONLY quaver/VTB extraction —
#   * forecasts retrieved fresh from MARS (vtb.media.mars_retrieve, native grid).
#     10ff is retrieved as its raw 10u/10v components (NOT the derived "10si"
#     diagnostic — that field isn't archived for research streams/expvers such
#     as class=rd/expver=iekm). Wind speed = sqrt(u^2+v^2), combined AFTER
#     interpolating each component to the station (same as Methods 1 & 2; with
#     nearest-point interpolation the order doesn't affect the result).
#   * observations retrieved fresh from STVL (vtb.media.stvl_retrieve), requested
#     directly as "10ff" (stations report wind speed, not u/v components)
#   * forecasts interpolated to stations with Fieldset.aligned()
#     (interpolation_method: nearest — the VTB native default)
# Everything downstream (threshold/filter/scores/bootstrap/plot) is unchanged.
#
# Run on Atos with the vtb-capable venv (see submit_job_quaver.sh):
#     python run.py configs/deterministic/config_10ff_method3_quaverextract_iekm_vs_ifs.yaml
# ============================================================================

variable: "10ff"
start_date: "2026-01-01"
end_date: "2026-01-31"
mode: "deterministic"
backend: "quaver_extract"
forecast_days: [1, 3, 5]
lead_time_frequency: 3
skip_extraction_if_exists: false
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA — MARS identity keys used by the quaver/VTB retrieval
# ============================================================================
read_data:
  forecast_model1:                       # evaluated model
    name: "iekm"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "rd"
      expver: "iekm"
      stream: "oper"
      type: "fc"

  forecast_model2:                       # reference model
    name: "ifs_oper"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "od"
      expver: "0001"
      stream: "oper"
      type: "fc"

  # Observation source for STVL retrieval
  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false      # quaver_extract always derives speed from 10u/10v internally
  lapse_rate_correction: false
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/10ff_method3_quaverextract_iekm_vs_ifs"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"        # nearest (default, VTB native) | bilinear | idw

# ============================================================================
# AUXILIARY FIELDS (sdfor / lsm / orography)
# RETRIEVED from MARS first; these local paths are READ only as a fallback
# when MARS retrieval is not possible. Orography is retrieved per model using
# each model's read_data.<model>.quaver keys so heights match the model grid.
# ============================================================================
auxiliary_fields:
  model1:                                # iekm
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  model2:                                # ifs_oper
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — no season split, orography split only
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: false
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  min_valid_wind_speed: 0.0
  max_valid_wind_speed: 100.0

# ============================================================================
# STEP 5: THRESHOLD — fixed 10 m/s (extreme wind, above)
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 10.0
    event_type: "above"

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/10ff_method3_quaverextract_iekm_vs_ifs"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
