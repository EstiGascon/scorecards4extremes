# ============================================================================
# 10ff deterministic: ifs_oper (model1) vs iekm DestinE (model2)
# Period: 2025-03-01 to 2026-02-28, forecast days 1-5
# 6-hourly 10m wind speed, NO daily aggregation; all seasons pooled, orography split
# Threshold: fixed 12 m/s
# Matched to config_10ff_local_fixed12_6h_ifsvsaifs_fullyear_d1to5.yaml
# ============================================================================

variable: "10ff"
start_date: "2025-03-01"
end_date: "2026-02-28"
mode: "deterministic"
forecast_days: [1, 2, 3, 4, 5]
lead_time_frequency: 6
skip_daily_aggregation: true
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# STEP 1: READ DATA (local GRIB)
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs_oper"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/10wind_speed/forecast/raw/ifs_oper"

  forecast_model2:
    name: "iekm"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/10wind_speed/forecast/raw/iekm"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/10wind_speed/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: true
  lapse_rate_correction: false
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# Extraction is threshold-independent: reuses the existing p98-run directory (days 1,3,5).
# ============================================================================
extract_points:
  output_path: "./extracted_points/10ff_local_p98obsclim_ifs_oper_iekm_new"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco2559.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/destine_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — all seasons together, orography split, coastal included
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: false
  coastal_lsm_threshold: 0.9
  min_valid_wind_speed: 0.0
  max_valid_wind_speed: 100.0

# ============================================================================
# STEP 5: THRESHOLD — fixed 12 m/s
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 12.0
    event_type: "above"

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 500
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/10ff_local_fixed12_6h_ifsvsiekm_fullyear_d1to5"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
