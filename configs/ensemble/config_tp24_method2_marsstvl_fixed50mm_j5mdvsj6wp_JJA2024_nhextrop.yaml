# ============================================================================
# ENSEMBLE — METHOD 2 (MARS + STVL) — tp24 heavy precip, FIXED 50mm, JJA 2024
# NH EXTRATROPICS
# ============================================================================
# Same family as config_tp24_method2_marsstvl_fixed30mm_j5mdvsj6wp_JJA2024_nhextrop.yaml
# but using a FIXED 50mm threshold instead of 30mm (event_type "above" — very
# heavy 24h precip). All other settings (period, season, area, orography,
# filter, scores, bootstrap, ensemble structure) identical.
#
# Reference/control model : j5md research ENS (rd/enfo/j5md)  forecast_model1
# Evaluated model          : j6wp research ENS (rd/enfo/j6wp)  forecast_model2
# (see the p99obsclim sibling config for the full member-count/stream
# background notes)
#
# skip_extraction_if_exists: true AND extract_points.output_path points at
# the SAME directory as the p99obsclim sibling config -- the underlying
# extracted point data is identical regardless of threshold (threshold is
# only applied downstream in scoring), so this reuses the already-completed
# extraction instead of re-retrieving from MARS.
#
# Period: 2024-06-01 to 2024-08-31, single season "JJA" (Jun-Jul-Aug).
# ============================================================================

variable: "tp24"
start_date: "2024-06-01"
end_date: "2024-08-31"
mode: "ensemble"
backend: "local"
steps: [24, 48, 72, 96, 120, 144, 168, 192, 216, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 8
  include_control: true

# ============================================================================
# STEP 1: READ DATA — retrieve ENS from MARS (forecasts) + STVL (obs)
# ============================================================================
read_data:
  forecast_model1:                       # j5md research ENS (control/reference)
    name: "j5md_ens"
    source: "mars"
    unit_conversion_factor: 1000.0       # m -> mm
    mars:
      class: rd
      stream: enfo
      expver: "j5md"
      levtype: sfc
      time: "00"
      number: "1/to/8"
      base_path: "/ec/vol/destine/continuous_evaluation/precip/forecast_ENS/raw"
      control_source:
        mode: "own"                      # j5md has its own archived control member

  forecast_model2:                       # j6wp research ENS (evaluated)
    name: "j6wp_ens"
    source: "mars"
    unit_conversion_factor: 1000.0       # m -> mm
    mars:
      class: rd
      stream: enfo
      expver: "j6wp"
      levtype: sfc
      time: "00"
      number: "1/to/8"
      base_path: "/ec/vol/destine/continuous_evaluation/precip/forecast_ENS/raw"
      control_source:
        mode: "own"                      # j6wp has its own archived control member

  observation_source: "stvl"
  stvl:
    sources: ["synop", "hdobs"]
    base_path: "/ec/vol/destine/continuous_evaluation/precip/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: 24

# ============================================================================
# STEP 3: EXTRACT POINT DATA (reused from the p99obsclim sibling -- see note above)
# ============================================================================
extract_points:
  output_path: "./extracted_points/tp24_method2_marsstvl_p99obsclim_j5mdvsj6wp_JJA2024_nhextrop"
  save_format: "pandas"
  area: "nh_extratropics"

# ============================================================================
# AUXILIARY FIELDS (sdfor / lsm / orography — same grid for both models)
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — JJA season, orography split
# ============================================================================
filter:
  lead_times: null
  season: "JJA"
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  max_valid_precipitation: 800.0

# ============================================================================
# STEP 5: THRESHOLD — FIXED 50mm (very heavy 24h precip, above)
# ============================================================================
threshold:
  method: "fixed"
  fixed:
    value: 50.0
    event_type: "above"

# ============================================================================
# STEP 6: SCORES (ensemble)
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q090"
    - "tw_quantile_score_q095"
    - "tw_quantile_score_q099"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 500
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/tp24_method2_marsstvl_fixed50mm_j5mdvsj6wp_JJA2024_nhextrop"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
