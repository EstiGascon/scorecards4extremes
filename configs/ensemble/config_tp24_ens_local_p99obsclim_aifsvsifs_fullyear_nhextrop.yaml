# NH-extratropics twin of config_tp24_ens_local_p99obsclim_aifsvsifs_fullyear.yaml
# area=nh_extratropics; unique extraction/results dirs; else identical.
variable: tp24
start_date: '2025-07-02'
end_date: '2026-07-01'
mode: ensemble
steps:
- 24
- 48
- 72
- 96
- 120
- 144
- 168
- 192
- 216
- 240
skip_extraction_if_exists: true
skip_scoring_if_exists: true
ensemble:
  n_members: 50
  include_control: true
read_data:
  forecast_model1:
    name: ifsens4aifs_0.25degree
    source: local_grib
    unit_conversion_factor: 1000.0
    local_grib:
      path: /ec/vol/destine/continuous_evaluation/precip/forecast_ENS/raw/ifsens4aifs_0.25degree
  forecast_model2:
    name: aifs_ens_0.25degree
    source: local_grib
    unit_conversion_factor: 1.0
    local_grib:
      path: /ec/vol/destine/continuous_evaluation/precip/forecast_ENS/raw/aifs_ens_0.25degree
  observation_source: local_gpt
  local_gpt:
    path: /ec/vol/destine/continuous_evaluation/precip/obs/raw
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: 24
extract_points:
  output_path: ./extracted_points/tp24_ens_local_p99obsclim_aifsvsifs_fullyear_nhextrop
  save_format: pandas
  area: nh_extratropics
auxiliary_fields:
  model1:
    lsm_path: /ec/vol/destine/continuous_evaluation/lsm_tco1279.grib
    orog_path: /ec/vol/destine/continuous_evaluation/hres_orog.grib
  model2:
    lsm_path: /ec/vol/destine/continuous_evaluation/aifs_lsm.grib
    orog_path: /ec/vol/destine/continuous_evaluation/aifs_orog.grib
  sdfor_path: /ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib
filter:
  lead_times: null
  season:
  - DJF
  - JJA
  - SON
  orography_type:
  - low
  - mid
  - high
  orography_ranges:
    low:
    - 0
    - 40
    mid:
    - 40
    - 120
    high:
    - 120
    - 3000
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  max_valid_precipitation: 800.0
threshold:
  method: local_obs_climatology
  event_type: above
  local_obs_climatology:
    path: ./obs_clim_local
    parameter: tp
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65
scores:
  ensemble:
  - twCRPS
  - fCRPS
  - Brier
  - BSS
  - tw_quantile_score
  - tw_quantile_score_q099
  - tw_quantile_score_q0995
  - tw_quantile_score_q0999
  - extreme_spread_skill_ratio
  stratify_by:
  - lead_time
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95
save:
  output_directory: ./results/tp24_ens_local_p99obsclim_aifsvsifs_fullyear_nhextrop
  save_scores_csv: true
  save_forecast_obs_pairs: false
plot:
  heatmap_style: smooth
  enabled: true
  dpi: 300
  format: png
