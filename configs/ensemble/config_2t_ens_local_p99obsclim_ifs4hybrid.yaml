# ============================================================================
# Ensemble LOCAL: 2t — 99th percentile obs climatology (warm extremes)
# ============================================================================
# ifs_ens4hybrid (model1) vs hybrid_ens (model2)
# Period: 2025-10-21 to 2026-03-29 (overlap of both models)
# Steps: 24h to 240h (days 1–10)
# Threshold: per-station p99 from local obs climatology
# ============================================================================

variable: "2t"
start_date: "2025-10-21"
end_date: "2026-03-29"
mode: "ensemble"
steps: [12, 24, 36, 48, 60, 72, 84, 96, 108, 120, 132, 144, 156, 168, 180, 192, 204, 216, 228, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: false

# ============================================================================
# STEP 1: READ DATA
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs_ens4hybrid"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast_ENS/raw/ifs_ens4hybrid"

  forecast_model2:
    name: "hybrid_ens"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast_ENS/raw/hybrid_ens"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/2mtemp/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_ens_local_p99obsclim_ifs4hybrid"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  outlier_threshold_std: 5.0
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "2t"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "quantile_score"
    - "tw_quantile_score"
    - "tw_quantile_score_q090"
    - "tw_quantile_score_q095"
    - "tw_quantile_score_q099"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 500
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_ens_local_p99obsclim_ifs4hybrid"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
