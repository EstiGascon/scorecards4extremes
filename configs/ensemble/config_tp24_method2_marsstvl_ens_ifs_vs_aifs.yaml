# ============================================================================
# ENSEMBLE — METHOD 2 of 3 — direct MARS (forecast) + STVL (observations)
# ============================================================================
# tp24 heavy precipitation (>30 mm/24h), Europe. ENSEMBLE (50 perturbed +
# control). Native MARS grid (no regrid) — retrieval is heavier than the
# pre-staged 0.25-degree files used by method 1, but exercises the real
# MARS/STVL ensemble + de-accumulation path end to end.
# Evaluated model : IFS-ENS  (ifsens4aifs, class=od stream=enfo)  forecast_model1
# Reference model : AIFS-ENS (aifs_ens,   class=ai stream=enfo)   forecast_model2
#
# These are the AIFS-ENS vs IFS-ENS pair recently used in this tool. MARS ENS
# data is 6-hourly; AIFS requires the `model: aifs-ens` key. read_data.py
# automatically adds the (step - 24h) support steps needed to de-accumulate
# tp24 from the raw cumulative `tp` field.
#
# Validation window: 2 weeks of the AIFS/IFS common period (extend end_date to
# 2026-03-05 for the full comparison).
# ============================================================================

variable: "tp24"
start_date: "2025-11-03"
end_date: "2025-11-16"
mode: "ensemble"
backend: "local"
steps: [24, 48, 72, 96, 120]
skip_extraction_if_exists: false
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — retrieve ENS from MARS (forecasts) + STVL (obs)
# ============================================================================
read_data:
  forecast_model1:                       # IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "mars"
    unit_conversion_factor: 1000.0       # m -> mm
    mars:
      class: od
      stream: enfo
      expver: "1"
      levtype: sfc
      time: "00"
      number: "1/to/50"
      base_path: "/ec/vol/destine/continuous_evaluation/precip/forecast_ENS/raw"
      control_source:
        mode: "own"                      # control from the SAME experiment (default)

  forecast_model2:                       # AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "mars"
    unit_conversion_factor: 1.0          # AIFS tp already in kg m-2 (= mm)
    mars:
      class: ai
      stream: enfo
      expver: "1"
      model: "aifs-ens"                  # AIFS requires the model key
      levtype: sfc
      time: "00"
      number: "1/to/50"
      base_path: "/ec/vol/destine/continuous_evaluation/precip/forecast_ENS/raw"
      control_source:
        mode: "own"                      # control from the SAME experiment (default)

  observation_source: "stvl"
  stvl:
    sources: ["synop", "hdobs"]
    base_path: "/ec/vol/destine/continuous_evaluation/precip/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: 24

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/tp24_method2_marsstvl_ens_ifs_vs_aifs"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:                                # IFS-ENS
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:                                # AIFS-ENS
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: true
  max_valid_precipitation: 800.0

# ============================================================================
# STEP 5: THRESHOLD — fixed 30 mm (heavy precip, above)
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 30.0
    event_type: "above"

# ============================================================================
# STEP 6: SCORES (ensemble)
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q090"
    - "tw_quantile_score_q095"
    - "tw_quantile_score_q099"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/tp24_method2_marsstvl_ens_ifs_vs_aifs"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
