# ============================================================================
# Ensemble LOCAL: 2t — FIXED -5°C threshold (TEST, cold extremes)
# ============================================================================
# ifsens4aifs (model1, reference) vs aifs_ens (model2)
# COMMON PERIOD: 2025-11-03 to 2026-03-05 (123 days) — identical dates/steps
# to config_2t_ens_local_p1obsclim_aifsvsifs_commonperiod.yaml.
# TEST: uses a FIXED -5.0°C threshold instead of the per-station p1 obs
# climatology, to check whether the low/mid/high U-shape seen with the p1
# threshold persists under a simple, non-percentile threshold definition.
# Reuses the SAME extracted parquet (threshold choice doesn't affect
# extraction) but writes results/plots to a SEPARATE output directory so
# nothing from the p1 run is overwritten.
# ============================================================================

variable: "2t"
start_date: "2025-11-03"
end_date: "2026-03-05"
mode: "ensemble"
steps: [12, 24, 36, 48, 60, 72, 84, 96, 108, 120, 132, 144, 156, 168, 180, 192, 204, 216, 228, 240]
lead_time_frequency: 12
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA
# ============================================================================
read_data:
  forecast_model1:
    name: "ifsens4aifs"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast_ENS/raw/ifsens4aifs"

  forecast_model2:
    name: "aifs_ens"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast_ENS/raw/aifs_ens"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/2mtemp/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA — reuse the p1 run's already-extracted parquet
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_ens_local_p1obsclim_aifsvsifs_commonperiod"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: true
  outlier_threshold_std: 5.0
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — TEST: fixed -5.0°C (below), instead of p1 obs climatology
# ============================================================================
threshold:
  method: "fixed"
  event_type: "below"
  fixed:
    value: -5.0
    event_type: "below"

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q001"
    - "tw_quantile_score_q005"
    - "tw_quantile_score_q010"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 500
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS — separate directory, do not overwrite the p1 run
# ============================================================================
save:
  output_directory: "./results/2t_ens_local_fixedm5_aifsvsifs_commonperiod"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
