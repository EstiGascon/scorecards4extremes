# ============================================================================
# ENSEMBLE — METHOD 3 of 3 — backend = quaver_extract (VTB MARS + STVL)
# ============================================================================
# 2t cold extremes (< 0 °C), Europe. ENSEMBLE (50 perturbed + control).
# Evaluated model : IFS-ENS  (ifsens4aifs, class=od stream=enfo)  forecast_model1
# Reference model : AIFS-ENS (aifs_ens,   class=ai stream=enfo)   forecast_model2
#
# These are the AIFS-ENS vs IFS-ENS pair recently used in this tool. MARS ENS
# data is 6-hourly; AIFS requires the `model: aifs-ens` key.
#
# Validation window: 2 weeks of the AIFS/IFS common period (extend end_date to
# 2026-03-05 for the full comparison).
#
# Extraction: STEP-1-ONLY quaver/VTB ensemble extraction —
#   * ENS forecasts retrieved fresh from MARS (control + 50 perturbed, native grid)
#   * observations retrieved fresh from STVL (vtb.media.stvl_retrieve)
#   * each member interpolated to stations with Fieldset.aligned()
#   * output schema fc{1,2}_member_0..50 (member 0 = control) — matches the local
#     ensemble extractor, so threshold/filter/scores/plot are unchanged.
#
# Run on Atos with the vtb-capable venv (see submit_job_quaver.sh):
#     python run.py configs/ensemble/config_2t_method3_quaverextract_ens_ifs_vs_aifs.yaml
# ============================================================================

variable: "2t"
start_date: "2025-11-03"
end_date: "2025-11-16"
mode: "ensemble"
backend: "quaver_extract"
steps: [6, 12, 18, 24, 54, 60, 66, 72, 102, 108, 114, 120]
skip_extraction_if_exists: false
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — MARS identity keys used by the quaver/VTB retrieval
# ============================================================================
read_data:
  forecast_model1:                       # IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "quaver"
    unit_conversion_factor: 1.0          # 2t is in K; K->C handled internally
    quaver:
      class: "od"
      expver: "1"
      stream: "enfo"                     # ensemble; control resolved per class/date
      type: "pf"                         # perturbed members; control via cf/fc
      number: "1/to/50"
      control_source:
        mode: "own"                      # control from the SAME experiment (default)

  forecast_model2:                       # AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "ai"
      expver: "1"
      stream: "enfo"
      type: "pf"
      number: "1/to/50"
      model: "aifs-ens"                  # AIFS requires the model key
      control_source:
        mode: "own"                      # control from the SAME experiment (default)

  # Observation source for STVL retrieval
  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_method3_quaverextract_ens_ifs_vs_aifs"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"        # nearest (default, VTB native) | bilinear | idw

# ============================================================================
# AUXILIARY FIELDS (sdfor / lsm / per-model orography — retrieved then read)
# ============================================================================
auxiliary_fields:
  model1:                                # IFS-ENS
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:                                # AIFS-ENS
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — no season split, orography split only
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — fixed 0 °C (cold extreme, below)
# ============================================================================
threshold:
  method: "fixed"
  event_type: "below"
  fixed:
    value: 0.0
    event_type: "below"

# ============================================================================
# STEP 6: SCORES (ensemble)
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "twMAE"
    - "Brier"
    - "BSS"
    - "quantile_score"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_method3_quaverextract_ens_ifs_vs_aifs"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
