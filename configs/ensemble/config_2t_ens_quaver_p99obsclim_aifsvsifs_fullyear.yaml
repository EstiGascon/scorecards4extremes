# ============================================================================
# Ensemble QUAVER (METHOD 3): 2t — 99th percentile obs climatology (warm extremes)
# FULL YEAR via live MARS+STVL retrieval (bypasses the stale local_grib mirror)
# ============================================================================
# ifsens4aifs = operational IFS-ENS (class=od, stream=enfo, expver=1)
# aifs_ens    = operational AIFS-ENS (class=ai, stream=enfo, expver=1)
#
# WHY THIS CONFIG EXISTS: config_2t_ens_local_p99obsclim_aifsvsifs.yaml reads
# pre-cached local GRIB mirrors (source: local_grib) which stop being updated
# at 2026-03-19 for ifsens4aifs / 2026-05-11 for aifs_ens — NOT because the
# operational archive ends there, but because that specific disk mirror was
# never kept current. Confirmed the underlying operational MARS archive
# (cached under .../raw/od_enfo_1 by earlier method2 runs) actually has data
# through at least 2026-08-02. This config retrieves directly from MARS+STVL
# (backend: quaver_extract) so the full year 2025-07-02 -> 2026-07-01 is
# genuinely available, including MAM/JJA which were thin in the local_grib run.
#
# Output schema (fc{1,2}_member_0..50) matches the local extractor exactly, so
# threshold/filter/scores/plot are unchanged from config_2t_ens_local_p99obsclim_aifsvsifs.yaml.
# ============================================================================

variable: "2t"
start_date: "2025-07-02"
end_date: "2026-07-01"
mode: "ensemble"
backend: "quaver_extract"
steps: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192, 198, 204, 210, 216, 222, 228, 234, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — MARS identity keys used by the quaver/VTB retrieval
# ============================================================================
read_data:
  forecast_model1:                       # operational IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "quaver"
    unit_conversion_factor: 1.0          # 2t is in K; K->C handled internally
    quaver:
      class: "od"
      expver: "1"
      stream: "enfo"
      type: "pf"                         # perturbed members; control via cf/fc
      number: "1/to/50"
      control_source:
        mode: "own"

  forecast_model2:                       # operational AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "ai"
      expver: "1"
      stream: "enfo"
      type: "pf"
      number: "1/to/50"
      model: "aifs-ens"                  # AIFS requires the model key
      control_source:
        mode: "own"

  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_ens_quaver_p99obsclim_aifsvsifs_fullyear"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "MAM", "JJA", "SON"]
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "2t"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q099"
    - "tw_quantile_score_q0995"
    - "tw_quantile_score_q0999"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_ens_quaver_p99obsclim_aifsvsifs_fullyear"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
