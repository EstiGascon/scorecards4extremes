# ============================================================================
# ENSEMBLE — METHOD 3 (quaver_extract) — mn2t cold extremes (p1), FULL YEAR
# EUROPE
# ============================================================================
# Ensemble counterpart of
# configs/deterministic/config_mn2t_method3_quaverextract_p1obsclim_ifsvsaifs_fullyear.yaml
# — same variable (mn2t = daily MIN of 6-hourly 2t), same p1 obs-climatology
# threshold and orography split, but scoring the ENSEMBLE (IFS-ENS vs AIFS-ENS).
#
#   Reference model : operational IFS-ENS  (ifsens4aifs, od/enfo/1)
#   Evaluated model : operational AIFS-ENS (aifs_ens,    ai/enfo/1)
#
# DATA-AVAILABILITY / PERIOD NOTE (mirrors config_mx2t_ens_quaver_p99obsclim_aifsvsifs_fullyear.yaml):
#  * START capped at 2025-07-02 — operational AIFS-ENS (ai/enfo/1) only becomes
#    available from ~mid-2025; cannot go back further.
#  * END capped at 2026-03-19 (matches the deterministic mn2t fullyear period).
#    Summer 2026 is deliberately EXCLUDED: different AIFS-ENS model version.
#  * MAM DROPPED from the season list — within 2025-07-02 -> 2026-03-19 it has
#    only ~19 sparse days (1-19 Mar 2026), too few to score meaningfully.
#
# 6-hourly steps out to day 10 (240h) give the sub-daily 2t needed for the
# mn2t daily-min aggregation at scoring time.
#
# The threshold uses clim_mn2t_* climatology files (obs_clim_local/, present).
# ============================================================================

variable: "mn2t"
start_date: "2025-07-02"
end_date: "2026-03-19"
mode: "ensemble"
backend: "quaver_extract"
steps: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192, 198, 204, 210, 216, 222, 228, 234, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: true

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — MARS identity keys used by the quaver/VTB retrieval
# ============================================================================
read_data:
  forecast_model1:                       # operational IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "quaver"
    unit_conversion_factor: 1.0          # 2t is in K; K->C handled internally
    quaver:
      class: "od"
      expver: "1"
      stream: "enfo"
      type: "pf"                         # perturbed members; control via cf/fc
      number: "1/to/50"
      control_source:
        mode: "own"

  forecast_model2:                       # operational AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "ai"
      expver: "1"
      stream: "enfo"
      type: "pf"
      number: "1/to/50"
      model: "aifs-ens"                  # AIFS requires the model key
      control_source:
        mode: "own"

  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/mn2t_ens_quaver_p1obsclim_aifsvsifs_fullyear"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — DJF/JJA/SON (MAM dropped), 3 orography columns
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "JJA", "SON"]      # MAM excluded: only ~19 sparse days in 2025-07-02 -> 2026-03-19 window
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 1st pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "below"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "mn2t"
    percentile: 1
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q099"
    - "tw_quantile_score_q0995"
    - "tw_quantile_score_q0999"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/mn2t_ens_quaver_p1obsclim_aifsvsifs_fullyear"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
