# ============================================================================
# Ensemble LOCAL: tp24 — 99th percentile obs climatology (heavy precip)
# FULL YEAR + CONTROL MEMBER — NATIVE GRID (no 0.25-degree interpolation)
# ============================================================================
# ifsens4aifs (model1) vs aifs_ens (model2), on each model's ORIGINAL/NATIVE
# grid — the direct-comparison counterpart to
# config_tp24_ens_local_p99obsclim_aifsvsifs_fullyear.yaml, which reads the
# pre-interpolated 0.25-degree fast dataset. Both read locally staged GRIB
# (fast local backend), so this is NOT the slow live-MARS native config
# (config_tp24_ens_mars_p99obsclim_aifsvsifs_native_fullyear.yaml).
# Separate extraction + results dirs (different resolution, not concatenable
# with the 0.25-degree run).
# Period: 2025-07-02 to 2026-07-01 (native ifsens4aifs data currently ends
# 2026-03-19; later dates simply have no IFS member and are skipped).
# MAM dropped (too little heavy-precip data), matching the 0.25-degree run.
# Steps: 24h to 240h (days 1-10). Threshold: per-station p99 obs climatology.
# ============================================================================

variable: "tp24"
start_date: "2025-07-02"
# Native IFS-ENS precip currently ends 2026-03-19; no scorable pairs beyond it.
end_date: "2026-03-19"
mode: "ensemble"
steps: [24, 48, 72, 96, 120, 144, 168, 192, 216, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: true

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA
# ============================================================================
read_data:
  forecast_model1:
    name: "ifsens4aifs"
    source: "local_grib"
    unit_conversion_factor: 1000.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast_ENS/raw/ifsens4aifs"

  forecast_model2:
    name: "aifs_ens"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/precip/forecast_ENS/raw/aifs_ens"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/precip/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: 24

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/tp24_ens_local_p99obsclim_aifsvsifs_native_fullyear"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "JJA", "SON"]
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  max_valid_precipitation: 800.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "tp"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q099"
    - "tw_quantile_score_q0995"
    - "tw_quantile_score_q0999"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/tp24_ens_local_p99obsclim_aifsvsifs_native_fullyear"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
