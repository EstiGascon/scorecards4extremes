# ============================================================================
# ENSEMBLE — METHOD 2 of 3 — direct MARS (forecast) + STVL (observations)
# ============================================================================
# 10ff wind extremes (> 10 m/s), Europe. ENSEMBLE (50 perturbed + control).
# Evaluated model : IFS-ENS  (ifsens4aifs, class=od stream=enfo)  forecast_model1
# Reference model : AIFS-ENS (aifs_ens,   class=ai stream=enfo)   forecast_model2
#
# These are the AIFS-ENS vs IFS-ENS pair recently used in this tool. MARS ENS
# data is 6-hourly; AIFS requires the `model: aifs-ens` key.
#
# Wind speed is computed from raw 10u/10v components per member (never 10si).
# Extend end_date to 2026-03-05 for the full common-period comparison.
# ============================================================================

variable: "10ff"
start_date: "2025-11-03"
end_date: "2025-11-16"
mode: "ensemble"
backend: "local"
steps: [6, 12, 18, 24, 54, 60, 66, 72, 102, 108, 114, 120]
skip_extraction_if_exists: false
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — retrieve ENS from MARS (forecasts) + STVL (obs)
# ============================================================================
read_data:
  forecast_model1:                       # IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "mars"
    unit_conversion_factor: 1.0
    mars:
      class: od
      stream: enfo
      expver: "1"
      levtype: sfc
      time: "00"
      number: "1/to/50"
      base_path: "/ec/vol/destine/continuous_evaluation/10wind_speed/forecast_ENS/raw"

  forecast_model2:                       # AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "mars"
    unit_conversion_factor: 1.0
    mars:
      class: ai
      stream: enfo
      expver: "1"
      model: "aifs-ens"                  # AIFS requires the model key
      levtype: sfc
      time: "00"
      number: "1/to/50"
      base_path: "/ec/vol/destine/continuous_evaluation/10wind_speed/forecast_ENS/raw"

  observation_source: "stvl"
  stvl:
    sources: ["synop", "hdobs"]
    base_path: "/ec/vol/destine/continuous_evaluation/10wind_speed/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: true       # compute sqrt(10u^2 + 10v^2) per member
  lapse_rate_correction: false
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/10ff_method2_marsstvl_ens_ifs_vs_aifs"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS (sdfor / lsm / per-model orography)
# ============================================================================
auxiliary_fields:
  model1:                                # IFS-ENS
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:                                # AIFS-ENS
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — no season split, orography split only
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: false
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  min_valid_wind_speed: 0.0
  max_valid_wind_speed: 100.0

# ============================================================================
# STEP 5: THRESHOLD — fixed 10 m/s (wind extreme, above)
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 10.0
    event_type: "above"

# ============================================================================
# STEP 6: SCORES (ensemble)
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "twMAE"
    - "Brier"
    - "BSS"
    - "quantile_score"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/10ff_method2_marsstvl_ens_ifs_vs_aifs"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  create_heatmap: true
  dpi: 300
  format: "png"
