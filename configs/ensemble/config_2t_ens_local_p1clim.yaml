# ============================================================================
# Ensemble LOCAL: 2t — 1st percentile dataset climatology (cold)
# ============================================================================
# Local replica of config_2t_ens_quaver_hdobs_p1clim.yaml for comparison.
# Uses local grib files instead of Quaver.
# Note: station_climatology is not available for local backend — falls back
# to dataset_climatology (pooled 1st percentile from all obs).
# ifs_ens vs hybrid_ens — Steps: 24h to 240h (days 1–10)
# ============================================================================

variable: "2t"
start_date: "2025-10-21"
end_date: "2026-03-29"
mode: "ensemble"
steps: [24, 48, 72, 96, 120, 144, 168, 192, 216, 240]
skip_extraction_if_exists: false
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: false

# ============================================================================
# STEP 1: READ DATA
# ============================================================================
read_data:
  forecast_model1:
    name: "ifs_ens"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast_ENS/raw/ifs_ens"

  forecast_model2:
    name: "hybrid_ens"
    source: "local_grib"
    unit_conversion_factor: 1.0
    local_grib:
      path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast_ENS/raw/hybrid_ens"

  observation_source: "local_gpt"
  local_gpt:
    path: "/ec/vol/destine/continuous_evaluation/2mtemp/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_ens_local_p1clim"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  outlier_threshold_std: 5.0
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — 1st percentile (cold extremes)
# ============================================================================
# station_climatology falls back to dataset_climatology for local backend
threshold:
  method: "station_climatology"
  event_type: "below"
  station_climatology:
    percentile: 1

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "twMAE"
    - "Brier"
    - "BSS"
    - "quantile_score"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 100
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_ens_local_p1clim"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
