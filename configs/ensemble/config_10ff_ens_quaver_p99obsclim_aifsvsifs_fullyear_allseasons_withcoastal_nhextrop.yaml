# NH-extratropics twin of config_10ff_ens_quaver_p98obsclim_aifsvsifs_fullyear_allseasons_withcoastal.yaml
# area=nh_extratropics; unique extraction/results dirs; else identical.
variable: 10ff
start_date: '2025-07-02'
end_date: '2026-07-01'
mode: ensemble
backend: quaver_extract
steps:
- 6
- 12
- 18
- 24
- 30
- 36
- 42
- 48
- 54
- 60
- 66
- 72
- 78
- 84
- 90
- 96
- 102
- 108
- 114
- 120
- 126
- 132
- 138
- 144
- 150
- 156
- 162
- 168
- 174
- 180
- 186
- 192
- 198
- 204
- 210
- 216
- 222
- 228
- 234
- 240
skip_extraction_if_exists: true
skip_scoring_if_exists: false
ensemble:
  n_members: 50
  include_control: true
read_data:
  forecast_model1:
    name: ifsens4aifs
    source: quaver
    unit_conversion_factor: 1.0
    quaver:
      class: od
      expver: '1'
      stream: enfo
      type: pf
      number: 1/to/50
      control_source:
        mode: own
  forecast_model2:
    name: aifs_ens
    source: quaver
    unit_conversion_factor: 1.0
    quaver:
      class: ai
      expver: '1'
      stream: enfo
      type: pf
      number: 1/to/50
      model: aifs-ens
      control_source:
        mode: own
  observation_source: quaver
  quaver_obs:
    sources:
    - synop
    - hdobs
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: null
extract_points:
  output_path: ./extracted_points/10ff_ens_quaver_p99obsclim_aifsvsifs_fullyear_allseasons_withcoastal_nhextrop
  save_format: pandas
  area: nh_extratropics
  interpolation_method: nearest
auxiliary_fields:
  model1:
    lsm_path: /ec/vol/destine/continuous_evaluation/lsm_tco1279.grib
    orog_path: /ec/vol/destine/continuous_evaluation/orog_tco1279.grib
  model2:
    lsm_path: /ec/vol/destine/continuous_evaluation/aifs_lsm.grib
    orog_path: /ec/vol/destine/continuous_evaluation/aifs_orog.grib
  sdfor_path: /ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib
filter:
  lead_times: null
  season: null
  orography_type:
  - flat
  - hilly
  - complex
  orography_ranges:
    flat:
    - 0
    - 40
    hilly:
    - 40
    - 120
    complex:
    - 120
    - 3000
  remove_coastal_stations: false
  coastal_lsm_threshold: 0.9
  min_valid_wind_speed: 0.0
  max_valid_wind_speed: 100.0
threshold:
  method: local_obs_climatology
  event_type: above
  local_obs_climatology:
    path: ./obs_clim_local
    parameter: 10ff
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65
scores:
  ensemble:
  - twCRPS
  - fCRPS
  - Brier
  - BSS
  - tw_quantile_score
  - tw_quantile_score_q099
  - tw_quantile_score_q0995
  - tw_quantile_score_q0999
  - extreme_spread_skill_ratio
  stratify_by:
  - lead_time
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95
save:
  output_directory: ./results/10ff_ens_quaver_p99obsclim_aifsvsifs_fullyear_allseasons_withcoastal_nhextrop
  save_scores_csv: true
  save_forecast_obs_pairs: false
plot:
  heatmap_style: smooth
  enabled: true
  dpi: 300
  format: png
