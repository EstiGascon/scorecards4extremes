# ============================================================================
# ENSEMBLE — METHOD 3 (quaver_extract) — mx2t warm extremes, JJA 2026
# EUROPE — FIXED THRESHOLD: mx2t > 35 °C
# ============================================================================
# Same as config_mx2t_ens_quaver_p99obsclim_aifsvsifs_JJA2026_europe.yaml but
# the threshold is a FIXED 35 °C (event_type "above") instead of the p99 local
# obs-climatology. Everything else — models, period, area, orography split,
# lapse-rate correction — is identical.
#
# extract_points.output_path points at the ALREADY-EXTRACTED p99 JJA2026
# europe point data (extraction is threshold-independent): with
# skip_extraction_if_exists: true the run reuses it and only re-scores.
#
#   Reference model : operational IFS-ENS  (ifsens4aifs, od/enfo/1)
#   Evaluated model : operational AIFS-ENS (aifs_ens,    ai/enfo/1)
# ============================================================================

variable: "mx2t"
start_date: "2026-06-01"
end_date: "2026-08-31"
mode: "ensemble"
backend: "quaver_extract"
steps: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192, 198, 204, 210, 216, 222, 228, 234, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — MARS identity keys used by the quaver/VTB retrieval
# ============================================================================
read_data:
  forecast_model1:                       # operational IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "quaver"
    unit_conversion_factor: 1.0          # 2t is in K; K->C handled internally
    quaver:
      class: "od"
      expver: "1"
      stream: "enfo"
      type: "pf"                         # perturbed members; control via cf/fc
      number: "1/to/50"
      control_source:
        mode: "own"

  forecast_model2:                       # operational AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "ai"
      expver: "1"
      stream: "enfo"
      type: "pf"
      number: "1/to/50"
      model: "aifs-ens"                  # AIFS requires the model key
      control_source:
        mode: "own"

  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA — reuse the p99 JJA2026 europe extraction
# ============================================================================
extract_points:
  output_path: "./extracted_points/mx2t_ens_quaver_p99obsclim_aifsvsifs_JJA2026_europe"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — JJA only, 3 orography columns
# ============================================================================
filter:
  lead_times: null
  season: "JJA"
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — fixed 35 °C, warm extremes (above)
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 35.0

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q099"
    - "tw_quantile_score_q0995"
    - "tw_quantile_score_q0999"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/mx2t_ens_quaver_fixed35_aifsvsifs_JJA2026_europe"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
