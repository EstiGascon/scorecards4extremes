# ============================================================================
# ENSEMBLE — METHOD 3 (quaver_extract) — 10ff extreme wind (p98), FULL YEAR
# INCLUDING COASTAL STATIONS
# ============================================================================
# Ensemble counterpart of
# configs/deterministic/config_10ff_method3_quaverextract_p98obsclim_ifsvsaifs_fullyear_allseasons.yaml
# — same variable (10ff, from raw 10u/10v), same p98 obs-climatology threshold,
# same period (2025-07-02 -> 2026-07-01), same NO-season-split + orography
# split — but scoring the ensemble (IFS-ENS vs AIFS-ENS) instead of the
# deterministic runs. backend: quaver_extract (in-memory, no GRIB staged to
# disk) is the fastest extraction method.
#
#   Reference model : operational IFS-ENS  (ifsens4aifs, od/enfo/1)
#   Evaluated model  : operational AIFS-ENS (aifs_ens,    ai/enfo/1)
#
# COASTAL STATIONS ARE INCLUDED (remove_coastal_stations: false) — matches the
# coastal-included deterministic rerun
# (config_10ff_method3_quaverextract_p98obsclim_ifsvsaifs_fullyear_allseasons_withcoastal.yaml).
# 6-hourly steps out to day 10 (240h). AIFS-ENS archive begins 2025-07-02, so
# this period is fully available on the ensemble side.
# ============================================================================

variable: "10ff"
start_date: "2025-07-02"
end_date: "2026-07-01"
mode: "ensemble"
backend: "quaver_extract"
steps: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192, 198, 204, 210, 216, 222, 228, 234, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — MARS identity keys used by the quaver/VTB retrieval
# ============================================================================
read_data:
  forecast_model1:                       # operational IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "od"
      expver: "1"
      stream: "enfo"
      type: "pf"
      number: "1/to/50"
      control_source:
        mode: "own"

  forecast_model2:                       # operational AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "ai"
      expver: "1"
      stream: "enfo"
      type: "pf"
      number: "1/to/50"
      model: "aifs-ens"                  # AIFS requires the model key
      control_source:
        mode: "own"

  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false      # VTB retrieves 10u/10v; speed computed in extractor
  lapse_rate_correction: false
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/10ff_ens_quaver_p98obsclim_aifsvsifs_fullyear_allseasons_withcoastal"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:                                # IFS-ENS
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:                                # AIFS-ENS
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA — NO season split (all seasons together); orography only
# COASTAL STATIONS INCLUDED (remove_coastal_stations: false)
# ============================================================================
filter:
  lead_times: null
  season: null
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: false
  coastal_lsm_threshold: 0.9
  min_valid_wind_speed: 0.0
  max_valid_wind_speed: 100.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 98th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "10ff"
    percentile: 98
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q099"
    - "tw_quantile_score_q0995"
    - "tw_quantile_score_q0999"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/10ff_ens_quaver_p98obsclim_aifsvsifs_fullyear_allseasons_withcoastal"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
