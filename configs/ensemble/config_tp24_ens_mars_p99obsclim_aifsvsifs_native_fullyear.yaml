# ============================================================================
# Ensemble MARS (METHOD 2): tp24 — 99th percentile obs climatology (heavy precip)
# FULL YEAR, NATIVE GRID (no regrid/conservative interpolation)
# ============================================================================
# Companion to config_tp24_ens_mars_p99obsclim_aifsvsifs_BACKWARD.yaml (which
# regrids to 0.25/0.25 with conservative interpolation to match the existing
# fast dataset). This config instead retrieves the FULL 2025-07-02 -> 2026-07-01
# year FROM SCRATCH via live MARS+STVL, on each model's ORIGINAL/NATIVE grid
# (no `grid`/`interpolation` keys) — for direct comparison against the
# conservative-regrid results, not for merging with the existing 0.25-degree
# fast dataset (different resolution, not directly concatenable).
#
# IMPORTANT: uses a DIFFERENT base_path/cache subdir from the regridded
# backward job (.../scorecards4extremes_native/... vs .../scorecards4extremes/...)
# — the cache filename convention does not encode grid/interpolation, so
# reusing the same cache dir as the regridded job would silently serve
# 0.25-degree data for a "native grid" request. Kept separate deliberately.
#
# Expect this to be SLOW and possibly very large: full 365-date x 2-model
# native-grid retrieval, same tape-recall bottleneck seen in every other live
# MARS job this session. Cached in /ec/vol/destine2 (300TB free) to avoid the
# disk-quota failure that hit the original destine-volume attempt.
# ============================================================================

variable: "tp24"
start_date: "2025-07-02"
end_date: "2026-07-01"
mode: "ensemble"
backend: "local"
steps: [24, 48, 72, 96, 120, 144, 168, 192, 216, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — retrieve ENS from MARS (forecasts) + STVL (obs)
# ============================================================================
read_data:
  forecast_model1:                       # operational IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "mars"
    unit_conversion_factor: 1000.0       # m -> mm
    mars:
      class: od
      stream: enfo
      expver: "1"
      levtype: sfc
      time: "00"
      number: "1/to/50"
      base_path: "/ec/vol/destine2/scorecards4extremes_native/precip/forecast_ENS/raw"
      control_source:
        mode: "own"

  forecast_model2:                       # operational AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "mars"
    unit_conversion_factor: 1.0          # AIFS tp already in kg m-2 (= mm)
    mars:
      class: ai
      stream: enfo
      expver: "1"
      model: "aifs-ens"
      levtype: sfc
      time: "00"
      number: "1/to/50"
      base_path: "/ec/vol/destine2/scorecards4extremes_native/precip/forecast_ENS/raw"
      control_source:
        mode: "own"

  observation_source: "stvl"
  stvl:
    sources: ["synop", "hdobs"]
    base_path: "/ec/vol/destine/continuous_evaluation/precip/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: 24

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/tp24_ens_mars_p99obsclim_aifsvsifs_native_fullyear"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/hres_orog.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "MAM", "JJA", "SON"]
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  max_valid_precipitation: 800.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "tp"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q099"
    - "tw_quantile_score_q0995"
    - "tw_quantile_score_q0999"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/tp24_ens_mars_p99obsclim_aifsvsifs_native_fullyear"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
