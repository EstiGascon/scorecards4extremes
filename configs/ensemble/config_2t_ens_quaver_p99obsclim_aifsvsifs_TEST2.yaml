# ============================================================================
# VALIDATION TEST — METHOD 3 (quaver_extract), SINGLE DATE 2026-04-12 only,
# to check whether the slow tape recall is specific to 2026-04-10 or affects
# the whole archive gap period.
# ============================================================================

variable: "2t"
start_date: "2026-04-12"
end_date: "2026-04-12"
mode: "ensemble"
backend: "quaver_extract"
steps: [6, 12, 18, 24]
skip_extraction_if_exists: true
skip_scoring_if_exists: false

ensemble:
  n_members: 50
  include_control: true

read_data:
  forecast_model1:
    name: "ifsens4aifs"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "od"
      expver: "1"
      stream: "enfo"
      type: "pf"
      number: "1/to/50"
      control_source:
        mode: "own"

  forecast_model2:
    name: "aifs_ens"
    source: "quaver"
    unit_conversion_factor: 1.0
    quaver:
      class: "ai"
      expver: "1"
      stream: "enfo"
      type: "pf"
      number: "1/to/50"
      model: "aifs-ens"
      control_source:
        mode: "own"

  observation_source: "quaver"
  quaver_obs:
    sources: ["synop", "hdobs"]

preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

extract_points:
  output_path: "./extracted_points/2t_ens_quaver_p99obsclim_aifsvsifs_TEST2"
  save_format: "pandas"
  area: "europe"
  interpolation_method: "nearest"

auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

filter:
  lead_times: null
  season: null
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "2t"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

bootstrap:
  enabled: false

save:
  output_directory: "./results/2t_ens_quaver_p99obsclim_aifsvsifs_TEST2"
  save_scores_csv: true
  save_forecast_obs_pairs: false

plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
