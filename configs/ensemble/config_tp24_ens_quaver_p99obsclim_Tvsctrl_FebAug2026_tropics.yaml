# ============================================================================
# ENSEMBLE (quaver_extract) — tp24 p99obsclim, T vs Control, Tropics, all stations
# 8 perturbed members (no control member), init 00 UTC, FMA + MJJA 2026 pooled
# ============================================================================
#   model 1 "control": rd/enfo/pf  FMA jccs | MJJA jcct
#   model 2 "T": rd/enfo/pf  FMA jc8r | MJJA jc8q
#   Dates: 2026-02-02..04-28 and 2026-05-13..08-23 (common availability).
#   Extraction is shared with the other region (20S-90N, 4 chunks under
#   configs/_chunks/config_tp24_ens_quaver_p99obsclim_Tvsctrl_FebAug2026_nhextrop); this config only scores, via filter.area.
#   Generated by scripts/make_ocean_ens_configs.py — edit that, not this file.
# ============================================================================

variable: tp24
start_date: '2026-02-02'
end_date: '2026-08-23'
mode: ensemble
backend: quaver_extract
steps:
- 24
- 48
- 72
- 96
- 120
- 144
- 168
- 192
- 216
- 240
skip_extraction_if_exists: true
skip_scoring_if_exists: false
ensemble:
  n_members: 8
  include_control: false
read_data:
  forecast_model1:
    name: control
    source: quaver
    unit_conversion_factor: 1000.0
    quaver:
      class: rd
      expver: jccs
      stream: enfo
      type: pf
      number: 1/to/8
  forecast_model2:
    name: T
    source: quaver
    unit_conversion_factor: 1000.0
    quaver:
      class: rd
      expver: jc8r
      stream: enfo
      type: pf
      number: 1/to/8
  observation_source: quaver
  quaver_obs:
    sources:
    - synop
    - hdobs
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  lapse_rate: -0.0065
  precipitation_accumulation_hours: 24
extract_points:
  output_path: ./extracted_points/tp24_ens_quaver_Tvsctrl_FebAug2026_nhtrop
  save_format: pandas
  area: null
  interpolation_method: nearest
auxiliary_fields:
  model1:
    lsm_path: /ec/vol/destine/continuous_evaluation/aifs_lsm.grib
    orog_path: /ec/vol/destine/continuous_evaluation/aifs_orog.grib
  model2:
    lsm_path: /ec/vol/destine/continuous_evaluation/aifs_lsm.grib
    orog_path: /ec/vol/destine/continuous_evaluation/aifs_orog.grib
  sdfor_path: /ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib
filter:
  lead_times: null
  season: null
  area: tropics
  orography_type: null
  orography_ranges:
    flat:
    - 0
    - 40
    hilly:
    - 40
    - 120
    complex:
    - 120
    - 3000
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  max_valid_precipitation: 800.0
threshold:
  method: local_obs_climatology
  event_type: above
  local_obs_climatology:
    path: ./obs_clim_local
    parameter: tp
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65
scores:
  ensemble:
  - twCRPS
  - fCRPS
  - CRPSS
  - Brier
  - BSS
  - reliability
  - tw_quantile_score
  - tw_quantile_score_q099
  - tw_quantile_score_q0995
  - tw_quantile_score_q0999
  - extreme_spread_skill_ratio
  stratify_by:
  - lead_time
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95
save:
  output_directory: ./results/tp24_ens_quaver_p99obsclim_Tvsctrl_FebAug2026_tropics
  save_scores_csv: true
  save_forecast_obs_pairs: false
plot:
  heatmap_style: smooth
  enabled: true
  dpi: 300
  format: png
