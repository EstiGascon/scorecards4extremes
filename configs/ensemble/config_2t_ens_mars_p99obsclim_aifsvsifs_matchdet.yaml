# ============================================================================
# Ensemble MARS (METHOD 2): 2t — 99th percentile obs climatology (warm extremes)
# TRUNCATED to AIFS-ENS availability (no regrid — native grid, like the
# existing fast local mirror this replaces the backward half of)
# ============================================================================
# Ensemble counterpart of the deterministic
# config_2t_method3_quaverextract_p99obsclim_ifsvsaifs_fullyear.yaml
# (which covers 2025-03-20 -> 2026-03-19).
#
# Supersedes config_2t_ens_mars_p99obsclim_aifsvsifs_BACKWARD.yaml (job
# 35315350), which failed on all 104 backward dates (2025-03-20 -> 2025-07-01).
# Probing MARS directly (2026-09-11) confirmed the AIFS-ENS archive
# (class=ai, stream=enfo, model=aifs-ens, param=2t) genuinely BEGINS on
# 2025-07-02 — identical boundary to the tp24 case — there is NO earlier data
# to backward-fill, live or otherwise (20250320..20250701 all "Data not
# found"; 2025-07-02 succeeds).
#
# So this job covers ONLY the achievable overlap with the det comparison:
# 2025-07-02 -> 2026-03-19 (~8.5 months, not a full year). MAM is dropped from
# the season split below because that window only contributes ~19 sparse days
# (2026-03-01 -> 2026-03-19) of MAM-labelled data, with none of MAM 2025 (the
# det comparison, by contrast, covers nearly all of MAM 2025 since it starts
# 2025-03-20). DJF/JJA/SON are still scored (JJA is missing June but July+
# August are fully sampled).
# ============================================================================

variable: "2t"
start_date: "2025-07-02"
end_date: "2026-03-19"
mode: "ensemble"
backend: "local"
steps: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192, 198, 204, 210, 216, 222, 228, 234, 240]
skip_extraction_if_exists: true
skip_scoring_if_exists: false

# ============================================================================
# ENSEMBLE SETTINGS
# ============================================================================
ensemble:
  n_members: 50
  include_control: true

# ============================================================================
# STEP 1: READ DATA — retrieve ENS from MARS (forecasts) + STVL (obs)
# ============================================================================
read_data:
  forecast_model1:                       # operational IFS-ENS (reference)
    name: "ifsens4aifs"
    source: "mars"
    unit_conversion_factor: 1.0
    mars:
      class: od
      stream: enfo
      expver: "1"
      levtype: sfc
      time: "00"
      number: "1/to/50"
      base_path: "/ec/vol/destine2/scorecards4extremes/2mtemp/forecast_ENS/raw"
      control_source:
        mode: "own"

  forecast_model2:                       # operational AIFS-ENS (evaluated)
    name: "aifs_ens"
    source: "mars"
    unit_conversion_factor: 1.0
    mars:
      class: ai
      stream: enfo
      expver: "1"
      model: "aifs-ens"
      levtype: sfc
      time: "00"
      number: "1/to/50"
      base_path: "/ec/vol/destine2/scorecards4extremes/2mtemp/forecast_ENS/raw"
      control_source:
        mode: "own"

  observation_source: "stvl"
  stvl:
    sources: ["synop", "hdobs"]
    base_path: "/ec/vol/destine/continuous_evaluation/2mtemp/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS DATA
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: true
  lapse_rate: -0.0065
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/2t_ens_mars_p99obsclim_aifsvsifs_matchdet"
  save_format: "pandas"
  area: "europe"

# ============================================================================
# AUXILIARY FIELDS
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/lsm_tco1279.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/orog_tco1279.grib"
  model2:
    lsm_path:  "/ec/vol/destine/continuous_evaluation/aifs_lsm.grib"
    orog_path: "/ec/vol/destine/continuous_evaluation/aifs_orog.grib"
  sdfor_path:  "/ec/vol/destine/continuous_evaluation/sdfor_tco1279.grib"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null
  season: ["DJF", "JJA", "SON"]      # MAM excluded: only ~19 sparse days in range
  orography_type: ["low", "mid", "high"]
  orography_ranges:
    low:  [0, 40]
    mid:  [40, 120]
    high: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  min_valid_temperature: -60.0
  max_valid_temperature: 60.0

# ============================================================================
# STEP 5: THRESHOLD — per-station 99th pct from local obs climatology files
# ============================================================================
threshold:
  method: "local_obs_climatology"
  event_type: "above"
  local_obs_climatology:
    path: "./obs_clim_local"
    parameter: "2t"
    percentile: 99
    window_days: 1
    n_years: 20
    first_year: 2005
    last_year: 2024
    min_availability_pct: 65

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  ensemble:
    - "twCRPS"
    - "fCRPS"
    - "Brier"
    - "BSS"
    - "tw_quantile_score"
    - "tw_quantile_score_q099"
    - "tw_quantile_score_q0995"
    - "tw_quantile_score_q0999"
    - "extreme_spread_skill_ratio"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
# n_samples reduced 200 -> 100 (2026-09-13): job 35709423 was CANCELLED at the
# QOS-enforced 48h wall-limit while only 22/261 dates into scoring (measured
# ~13.6 min/date => ~59h needed at n_samples=200, and the QOS rejects any
# --time override above 48h). Extraction is fully cached, so this resubmit
# gets the full 48h budget for scoring; halving the bootstrap resample count
# is the practical way to fit inside that limit without splitting the run.
bootstrap:
  enabled: true
  n_samples: 100
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE RESULTS
# ============================================================================
save:
  output_directory: "./results/2t_ens_mars_p99obsclim_aifsvsifs_matchdet"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  heatmap_style: "smooth"
  enabled: true
  dpi: 300
  format: "png"
