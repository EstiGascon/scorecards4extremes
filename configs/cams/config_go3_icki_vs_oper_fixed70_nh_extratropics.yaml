# ============================================================================
# CAMS AirNow Ozone (go3) — icki (control) vs oper, deterministic, fixed threshold 70 ppb
# Area: NORTHERN HEMISPHERE EXTRATROPICS (lat 20..90)
# ============================================================================
# Scores pre-aligned go3/AirNow point-parquet. Step 3 (Metview extraction) SKIPPED.
# Native 3-hourly resolution (NO daily-mean aggregation).
# Parquet: /home/moeg/scorecards4extremes/extracted_points/cams_go3_icki_vs_oper/
#          go3_icki_airnow_vs_oper_airnow_day{1..5}.parquet
# Threshold: 70 ppb ~ US EPA "Unhealthy for Sensitive Groups" (8h O3).
# ============================================================================

variable: "go3"
start_date: "2025-01-01"
end_date:   "2025-12-31"
mode: "deterministic"
forecast_days: [1, 2, 3, 4, 5]     # steps 3..120 h -> days 1..5
lead_time_frequency: 3             # steps are 3-hourly; keep all
skip_extraction_if_exists: true    # read pre-aligned parquet, skip Step 3
skip_scoring_if_exists:    false
skip_daily_aggregation:    true    # <-- score at native 3-hourly resolution (no daily mean)

# ============================================================================
# STEP 1: READ DATA  (paths only existence-checked; contents unused)
# ============================================================================
read_data:
  forecast_model1:
    name: "icki_airnow"            # control experiment (reference). MUST match token in go3_icki_airnow_vs_oper_airnow_day*.parquet
    source: "local_grib"
    local_grib:
      path: "/home/moeg/scorecards4extremes/extracted_points/cams_go3_icki_vs_oper"
  forecast_model2:
    name: "oper_airnow"            # experiment being evaluated
    source: "local_grib"
    local_grib:
      path: "/home/moeg/scorecards4extremes/extracted_points/cams_go3_icki_vs_oper"
  observation_source: "local_gpt"
  local_gpt:
    path: "/home/moeg/scorecards4extremes/extracted_points/cams_go3_icki_vs_oper"

# ============================================================================
# STEP 2: PRE-PROCESS  (all off — no post-processing needed)
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA  (skipped; output_path points at the parquet dir)
# ============================================================================
extract_points:
  output_path: "/home/moeg/scorecards4extremes/extracted_points/cams_go3_icki_vs_oper"
  save_format: "pandas"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  area: "nh_extratropics"           # lat/lon subset applied to loaded parquet (lat 20..90)
  lead_times: null
  season: ["DJF", "MAM", "JJA", "SON"]
  orography_type: "all"             # parquet has no 'sdfor' column
  remove_coastal_stations: false    # parquet has no 'lsm' column
  remove_outliers: false            # keep extremes

# ============================================================================
# STEP 5: THRESHOLD  (fixed 70 ppb, high-ozone extremes)
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 70.0

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
    - "correlation"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE
# ============================================================================
save:
  output_directory: "./results/go3_icki_vs_oper_fixed70_nh_extratropics"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  enabled: true
  heatmap_style: "smooth"
  create_summary: true
  dpi: 300
  format: "png"
