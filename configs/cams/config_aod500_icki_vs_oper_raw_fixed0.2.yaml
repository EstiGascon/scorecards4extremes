# ============================================================================
# CAMS AOD500 — icki (control) vs oper, deterministic, fixed threshold 0.2
# Reads RAW NetCDF (model + AERONET obs) directly — no pre-built parquet needed.
# ============================================================================
# Step 3 performs the full read+align+convert (cams_extract.py backend), then
# writes the standard pipeline parquet so Steps 4-9 are unchanged.
# ============================================================================

variable: "aod500"
start_date: "2025-01-01"
end_date:   "2025-12-31"
mode: "deterministic"
forecast_days: [1, 2, 3, 4, 5]     # steps 3..120 h -> days 1..5
lead_time_frequency: 3             # AOD steps are 3-hourly; keep all
skip_extraction_if_exists: true    # reuse extracted parquet on rerun
skip_scoring_if_exists:    false
skip_daily_aggregation:    true    # score at native 3-hourly resolution (no daily mean)

# ============================================================================
# STEP 1: READ DATA  (raw per-site NetCDF, read directly by cams_extract.py)
# ============================================================================
read_data:
  forecast_model1:
    name: "icki"                   # control experiment (reference) -> fc1_value
    source: "cams_netcdf"
    cams_netcdf:
      path: "/home/ecm7338/scorecards4extremes/cams_sample_data/icki"
  forecast_model2:
    name: "oper"                   # experiment being evaluated -> fc2_value
    source: "cams_netcdf"
    cams_netcdf:
      path: "/home/ecm7338/scorecards4extremes/cams_sample_data/oper"
  observation_source: "cams_netcdf"
  cams_netcdf:
    obs_path: "/home/ecm7338/scorecards4extremes/cams_sample_data/obs_aeronet"

# ============================================================================
# STEP 2: PRE-PROCESS  (all off — AOD needs no post-processing)
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA  (real extraction — reads raw NetCDF)
# ============================================================================
extract_points:
  output_path: "/home/moeg/scorecards4extremes/extracted_points/cams_aod500_icki_vs_oper_raw"
  save_format: "pandas"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  area: null                        # global (AERONET network)
  lead_times: null
  season: ["DJF", "MAM", "JJA", "SON"]
  orography_type: "all"             # parquet has no 'sdfor' column
  remove_coastal_stations: false    # parquet has no 'lsm' column
  remove_outliers: false            # AOD is right-skewed; keep extremes

# ============================================================================
# STEP 5: THRESHOLD  (fixed 0.2, per initial recommendation)
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 0.2

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
    - "correlation"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE
# ============================================================================
save:
  output_directory: "./results/aod500_icki_vs_oper_raw_fixed0.2"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  enabled: true
  heatmap_style: "smooth"
  create_summary: true
  dpi: 300
  format: "png"
