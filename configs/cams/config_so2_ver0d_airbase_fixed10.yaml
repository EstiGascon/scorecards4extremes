# ============================================================================
# CAMS SO2 vs EEA/Airbase (INERIS d20) — 10 ug/m3 (~7% obs events in winter, ~6% in summer)
# icki_airbase (control) vs oper_airbase, fixed threshold 10.0 ug/m3
# Reads RAW NetCDF from the ver0d archive directly — no pre-built parquet needed.
# obs SO2 in ug/m3; model kg/kg converted via t_ml137+lnsp (conv='density')
# ============================================================================
# Step 3 performs the full read+align+convert (cams_extract.py backend), then
# writes the standard pipeline parquet so Steps 4-9 are unchanged.
# ============================================================================

variable: "so2"
start_date: "2025-01-01"
end_date:   "2025-12-31"
mode: "deterministic"
forecast_days: [1, 2, 3, 4, 5]     # steps 3..120 h -> days 1..5
lead_time_frequency: 3             # model steps are 3-hourly; keep all
skip_extraction_if_exists: true    # reuse extracted parquet on rerun
skip_scoring_if_exists:    false
skip_daily_aggregation:    true    # score at native 3-hourly resolution (no daily mean)

# ============================================================================
# STEP 1: READ DATA  (raw per-site NetCDF, read directly by cams_extract.py)
# ============================================================================
read_data:
  forecast_model1:
    name: "icki_airbase"            # control experiment (reference) -> fc1_value
    source: "cams_netcdf"
    cams_netcdf:
      path: "/ec/vol/cams/ver0d/data/mode_gaw/model_data/icki_airbase"
  forecast_model2:
    name: "oper_airbase"            # experiment being evaluated -> fc2_value
    source: "cams_netcdf"
    cams_netcdf:
      path: "/ec/vol/cams/ver0d/data/mode_gaw/model_data/oper_airbase"
  observation_source: "cams_netcdf"
  cams_netcdf:
    network: "airbase"          # observation network (see cams_extract.NETWORKS)
    obs_path: "/ec/vol/cams/ver0d/data/mode_gaw/airbase_ineris_d20/processed"   # dated YYYY/ subdirs resolved from the network registry

# ============================================================================
# STEP 2: PRE-PROCESS  (all off — species already unit-converted in cams_extract.py)
# ============================================================================
preprocess:
  wind_speed_from_components: false
  lapse_rate_correction: false
  precipitation_accumulation_hours: null

# ============================================================================
# STEP 3: EXTRACT POINT DATA  (real extraction — reads raw NetCDF)
# ============================================================================
extract_points:
  output_path: "/perm/ecm7338/scorecards4extremes/extracted_points/cams_so2_airbase_icki_airbase_vs_oper_airbase"
  save_format: "pandas"

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  area: "europe"                     # airbase network domain
  lead_times: null
  season: ["DJF", "MAM", "JJA", "SON"]
  orography_type: "all"             # parquet has no 'sdfor' column
  remove_coastal_stations: false    # parquet has no 'lsm' column
  remove_outliers: false

# ============================================================================
# STEP 5: THRESHOLD  (fixed 10.0 ug/m3; EU 1h 350 / 24h 125 and WHO 24h 40 never or rarely reached)
# ============================================================================
threshold:
  method: "fixed"
  event_type: "above"
  fixed:
    value: 10.0

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
    - "correlation"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE
# ============================================================================
save:
  output_directory: "./results/so2_airbase_icki_airbase_vs_oper_airbase_fixed10.0"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  enabled: true
  heatmap_style: "smooth"
  create_summary: true
  dpi: 300
  format: "png"
