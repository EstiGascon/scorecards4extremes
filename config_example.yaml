# ============================================================================
# Scorecards4Extremes — Example / starter configuration
# ============================================================================
# Copy this file, rename it, and edit the five fields marked with  ← CHANGE
# Everything else is ready to run as-is.
#
# This example verifies 24 h precipitation (tp24) using a dataset-derived
# threshold — no external climatology files required.
# See docs/USER_GUIDE.md for all available options.
# ============================================================================

variable: "tp24"          # tp24 | 2t | 10ff
start_date: "2024-01-01"  # ← CHANGE: inclusive, YYYY-MM-DD
end_date:   "2024-03-31"  # ← CHANGE: keep short for a first test run
mode: "deterministic"
forecast_days: [1, 2, 3, 4, 5]   # forecast lead-time days to include
lead_time_frequency: 24            # 24 h daily steps for tp24
skip_extraction_if_exists: true    # skip Step 3 on re-runs if parquet files exist
skip_scoring_if_exists:    false

# ============================================================================
# STEP 1: READ DATA
# ============================================================================
read_data:
  forecast_model1:
    name: "model_A"                # ← CHANGE: short label (used in plots)
    source: "local_grib"           # local_grib | mars | quaver   (mars/quaver: ECMWF only)
    unit_conversion_factor: 1000.0 # m → mm for tp24
    local_grib:
      path: "/data/forecasts/model_A"  # ← CHANGE: path to GRIB files
    # --- source: "mars" (ECMWF only) — retrieve forecast GRIB directly ------------
    # Instead of local_grib, set source: mars and provide the MARS keys below. The
    # tool retrieves exactly the steps this config needs into a folder DERIVED from
    # the keys ({base_path}/{class}_{stream}_{expver}), so the folder always matches
    # the expver retrieved. param is derived from `variable`; step from forecast_days.
    # mars:
    #   class:  rd            # rd (research) | od (IFS oper) | ai (AIFS)
    #   type:   fc            # fc for deterministic (ignored in ensemble mode)
    #   stream: oper          # oper | enfo (auto enfo in ensemble mode)
    #   expver: "j5vo"
    #   levtype: sfc          # default sfc
    #   time:   "00"          # base cycle, default 00
    #   database: fdb         # optional (research/fdb data)
    #   grid: "0.25/0.25"     # optional regrid
    #   base_path: "/ec/vol/destine/continuous_evaluation/2mtemp/forecast/raw"

  forecast_model2:
    name: "model_B"                # ← CHANGE: short label
    source: "local_grib"
    unit_conversion_factor: 1000.0
    local_grib:
      path: "/data/forecasts/model_B"  # ← CHANGE: path to GRIB files

  observation_source: "local_gpt"  # local_gpt | stvl | quaver   (stvl/quaver: ECMWF only)
  local_gpt:
    path: "/data/observations"         # ← CHANGE: path to .gpt obs files
                                       # See docs/USER_GUIDE.md §13 for format
  # --- observation_source: "stvl" (ECMWF only) — retrieve obs directly from STVL ---
  # Set observation_source: stvl and provide the block below. The tool retrieves obs
  # for every forecast valid time and writes {variable}_obs_YYYYMMDDHH.geo into
  # base_path (never under $HOME). parameter is derived from `variable`.
  # stvl:
  #   sources: ["synop"]
  #   base_path: "/ec/vol/destine/continuous_evaluation/2mtemp/obs/raw"

# ============================================================================
# STEP 2: PRE-PROCESS
# ============================================================================
preprocess:
  wind_speed_from_components: false  # true for 10ff
  lapse_rate_correction: false       # true for 2t
  precipitation_accumulation_hours: 24  # 24 for tp24; null otherwise

# ============================================================================
# STEP 3: EXTRACT POINT DATA
# ============================================================================
extract_points:
  output_path: "./extracted_points/my_run"  # where to cache parquet files
  save_format: "pandas"
  area: "europe"   # geographic filter applied during extraction

# ============================================================================
# AUXILIARY FIELDS (required for lapse-rate correction and terrain filter)
# ============================================================================
auxiliary_fields:
  model1:
    lsm_path:  "/data/aux/lsm_model_A.grib"   # land-sea mask GRIB
    orog_path: "/data/aux/orog_model_A.grib"   # model orography GRIB
  model2:
    lsm_path:  "/data/aux/lsm_model_B.grib"
    orog_path: "/data/aux/orog_model_B.grib"
  sdfor_path:  "/data/aux/sdfor.grib"          # sub-grid std dev of orography

# ============================================================================
# STEP 4: FILTER DATA
# ============================================================================
filter:
  lead_times: null            # null = all; or e.g. [24, 48, 72]
  season: null                # null = all; or ["DJF", "MAM", "JJA", "SON"]
  orography_type: ["flat", "hilly", "complex"]
  orography_ranges:
    flat:    [0, 40]
    hilly:   [40, 120]
    complex: [120, 3000]
  remove_coastal_stations: true
  coastal_lsm_threshold: 0.9
  remove_outliers: false
  outlier_threshold_std: 5.0
  max_valid_precipitation: 800.0  # QC ceiling for tp24 (mm)
  min_valid_temperature: -60.0    # QC range for 2t (°C) — ignored for tp24
  max_valid_temperature:  60.0

# ============================================================================
# STEP 5: THRESHOLD
# ============================================================================
# dataset_climatology: uses the Nth percentile of the observations already
# in your dataset. No external files needed — ideal for first runs.
#
# For production runs, local_obs_climatology gives more stable per-station
# thresholds but requires pre-built climatology files (ECMWF users: see §11
# of the User Guide; external users: stick with dataset_climatology).
threshold:
  method: "dataset_climatology"
  event_type: "above"           # above = heavy precip; below = cold extremes
  dataset_climatology:
    percentile: 99

# ============================================================================
# STEP 6: SCORES
# ============================================================================
scores:
  deterministic:
    - "ETS"
    - "PSS"
    - "POD"
    - "FAR"
    - "twMAE"
    - "twRMSE"
    - "bias"
    - "mae"
    - "rmse"
    - "correlation"
  stratify_by:
    - "lead_time"

# ============================================================================
# STEP 7: BOOTSTRAP
# ============================================================================
bootstrap:
  enabled: true
  n_samples: 200          # 200 is fast; use 1000 for publication-quality runs
  confidence_level: 0.95

# ============================================================================
# STEP 8: SAVE
# ============================================================================
save:
  output_directory: "./results/my_run"
  save_scores_csv: true
  save_forecast_obs_pairs: false

# ============================================================================
# STEP 9: PLOT
# ============================================================================
plot:
  enabled: true                # master switch for Step 9 (false = skip all plotting)
  heatmap_style: "smooth"      # "smooth" = interpolated heatmaps + a 4-score panel figure;
                               # "normal" = discrete blocky heatmaps (one per score)
  create_summary: true         # also draw the multi-panel summary figure
                               # (single-condition runs only; auto-skipped when re-plotting
                               #  from saved CSVs because raw pairs aren't reloaded)
  dpi: 150                     # output resolution in dots-per-inch
  format: "png"                # output file type: png | pdf | svg
  # forecast_days: [1, 3, 5]   # optional: restrict heatmaps to these lead days (default: all scored days)
